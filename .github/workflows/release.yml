name: Native release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        shell: bash
        run: |
          if [[ '${{ matrix.platform }}' == 'macos-x64' ]]; then
            # Current cryptography has no Intel macOS wheel. Static linking
            # prevents its OpenSSL from colliding with Python's bundled dylib.
            OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)" \
              python -m pip install --no-cache-dir --no-binary=cryptography -r requirements-build.txt
          else
            python -m pip install -r requirements-build.txt
          fi
      - run: python -m unittest discover -s tests -v
      - run: python launcher.py self-test
      - run: node --check web/app.js
      - run: node --check web/setup.js
      - name: Build and smoke-test frozen binaries
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="0.2.0-preview"; fi
          python packaging/build.py --version "$VERSION" --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify all archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Oracle A1 Workbench $GITHUB_REF_NAME" \
            --notes-file ../docs/RELEASE_NOTES.md

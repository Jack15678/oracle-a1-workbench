name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile oracle_grab.py workbench.py runtime.py launcher.py oci_api.py onboarding.py
      - run: python launcher.py self-test
      - run: python launcher.py inspect --config config.example.json
      - run: node --check web/app.js
      - run: node --check web/setup.js
